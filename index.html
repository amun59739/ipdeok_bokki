
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>메인페이지</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">
        <div class="inner">

            <!-- 로고 -->
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="로고">
            </a>

            <!-- 메뉴 -->
            <button type="button" class="menu-btn" aria-label="메뉴 열기">
                <i data-lucide="menu"></i>
            </button>

        </div>
    </header>


    <main>

        <!-- =========================
             HERO SECTION
        ========================== -->

        <section class="hero" aria-label="메인 배너">
        </section>


        <!-- =========================
             SECTION 1
             주문 버튼
        ========================== -->

        <section class="section_1">

            <div class="inner">

                <div class="order-wrap">

                    <button type="button" class="order-btn delivery">
                        <i data-lucide="bike"></i>
                        배달 주문하기
                    </button>

                    <button type="button" class="order-btn phone">
                        <i data-lucide="phone"></i>
                        전화 주문하기
                    </button>

                    <button type="button" class="order-btn coupon">
                        <i data-lucide="ticket"></i>
                        쿠폰 사용
                    </button>

                </div>

            </div>

        </section>


        <!-- =========================
             SECTION 2
             추천 메뉴
        ========================== -->

        <section class="section_2">

            <div class="inner">

                <h2 class="section-title">추천 메뉴</h2>

                <!-- 해시태그 버튼 -->

                <div class="hashtag-wrap">

                    <button type="button" class="hashtag active">
                        #인기메뉴
                    </button>

                    <button type="button" class="hashtag">
                        #신메뉴
                    </button>

                    <button type="button" class="hashtag">
                        #추천메뉴
                    </button>

                </div>

            </div>


            <!-- 추천 메뉴 슬라이드 -->

            <div class="recommend-wrap">

                <!-- 추천 메뉴 1 -->

                <article class="recommend-item">

                    <div class="recommend-card">

                        <p class="recommend-subtitle">
                            추천 메뉴
                        </p>

                        <h3 class="recommend-title">
                            추천 메뉴 1
                        </h3>

                        <p class="recommend-desc">
                            메뉴 설명이 들어가는 영역입니다.
                        </p>

                        <div class="recommend-img recommend-img01">
                        </div>

                    </div>

                </article>


                <!-- 추천 메뉴 2 / 중앙 카드 -->

                <article class="recommend-item current">

                    <div class="recommend-card">

                        <p class="recommend-subtitle">
                            추천 메뉴
                        </p>

                        <h3 class="recommend-title">
                            추천 메뉴 2
                        </h3>

                        <p class="recommend-desc">
                            메뉴 설명이 들어가는 영역입니다.
                        </p>

                        <div class="recommend-img recommend-img02">
                        </div>

                    </div>

                </article>


                <!-- 추천 메뉴 3 -->

                <article class="recommend-item">

                    <div class="recommend-card">

                        <p class="recommend-subtitle">
                            추천 메뉴
                        </p>

                        <h3 class="recommend-title">
                            추천 메뉴 3
                        </h3>

                        <p class="recommend-desc">
                            메뉴 설명이 들어가는 영역입니다.
                        </p>

                        <div class="recommend-img recommend-img03">
                        </div>

                    </div>

                </article>

            </div>

        </section>


        <!-- =========================
             SECTION 3
             메뉴
        ========================== -->

        <section class="section_3">

            <div class="inner">

                <h2 class="section-title">메뉴</h2>

                <!-- 해시태그 버튼 -->

                <div class="hashtag-wrap">

                    <button type="button" class="hashtag active">
                        탭메뉴1
                    </button>

                    <button type="button" class="hashtag">
                        탭메뉴2
                    </button>

                    <button type="button" class="hashtag">
                        탭메뉴3
                    </button>

                </div>


                <!-- 메뉴 콘텐츠 -->

                <div class="menu-wrap">

                    <!-- 메뉴 1 -->

                    <article class="menu-item">

                        <div class="menu-img menu-img01">
                        </div>

                        <h3 class="menu-title">
                            메뉴 이름 1
                        </h3>

                    </article>


                    <!-- 메뉴 2 -->

                    <article class="menu-item">

                        <div class="menu-img menu-img02">
                        </div>

                        <h3 class="menu-title">
                            메뉴 이름 2
                        </h3>

                    </article>


                    <!-- 메뉴 3 -->

                    <article class="menu-item">

                        <div class="menu-img menu-img03">
                        </div>

                        <h3 class="menu-title">
                            메뉴 이름 3
                        </h3>

                    </article>


                    <!-- 메뉴 4 -->

                    <article class="menu-item">

                        <div class="menu-img menu-img04">
                        </div>

                        <h3 class="menu-title">
                            메뉴 이름 4
                        </h3>

                    </article>

                </div>

            </div>

        </section>


        <!-- =========================
             SECTION 4
             새로운 소식
        ========================== -->

        <section class="section_4">

            <div class="inner">

                <h2 class="section-title">새로운 소식</h2>

                <p class="section-desc">
                    다양한 소식과 새로운 이벤트를 만나보세요.
                </p>


                <!-- 탭 메뉴 -->

                <div class="tab-wrap">

                    <button type="button" class="tab-btn active">
                        전체
                    </button>

                    <button type="button" class="tab-btn">
                        공지사항
                    </button>

                    <button type="button" class="tab-btn">
                        이벤트
                    </button>

                </div>


                <!-- 소식 콘텐츠 -->

                <div class="news-wrap">

                    <!-- 콘텐츠 1 -->

                    <article class="news-item">

                        <div class="news-text">

                            <p class="news-subtitle">
                                공지사항
                            </p>

                            <h3 class="news-title">
                                새로운 소식을 확인해 보세요.
                            </h3>

                            <p class="news-date">
                                2026.11.24
                            </p>

                        </div>

                        <i data-lucide="chevron-right"></i>

                    </article>


                    <!-- 콘텐츠 2 -->

                    <article class="news-item">

                        <div class="news-text">

                            <p class="news-subtitle">
                                이벤트
                            </p>

                            <h3 class="news-title">
                                특별한 이벤트를 만나보세요.
                            </h3>

                            <p class="news-date">
                                2026.11.24
                            </p>

                        </div>

                        <i data-lucide="chevron-right"></i>

                    </article>


                    <!-- 콘텐츠 3 -->

                    <article class="news-item">

                        <div class="news-text">

                            <p class="news-subtitle">
                                공지사항
                            </p>

                            <h3 class="news-title">
                                서비스 이용 안내입니다.
                            </h3>

                            <p class="news-date">
                                2026.11.24
                            </p>

                        </div>

                        <i data-lucide="chevron-right"></i>

                    </article>

                </div>

            </div>

        </section>

    </main>


    <!-- Lucide Icons 실행 -->

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
